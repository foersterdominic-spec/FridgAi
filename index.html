<!DOCTYPE html>
<html>
    <head>
        <meta name="theme-color" content="#5d8eef">
        <link rel="manifest" href="manifest.json">
        <meta name="viewport" 
        content="width=device-width, initial-scale=1.0">
        <title>FridgAi</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <style>
            body {
                font-family: Arial, sans-serif;
                background: #5d8eef;
                padding: 20px;
            }

            h1 {
                text-align: center;
            }

            p {
                text-align: center;
            }

            .container {
                max-width: 400px;
                margin: auto;
                background: #84c6ff;
                padding: 15px;
                border-radius: 15px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }

            button {
                padding: 10px;
                border: none;
                border-radius: 10px;
                background: #ffffff;
                colour: white;
                font-size: 16px;
            }

            ul {
                max-width: 400px;
                margin: 20px auto;
                padding: 0;
            }

            li {
                display: flex;
                justify-content: space-between;
                padding: 10px;
                margin-top: 8px;
                background: #eee;
                border-radius: 10px;
            }

            .input-row {
                display: flex;
                gap: 10px;
            }

            .input-row input {
                flex: 1;
            }

            .sidebar {
                position: fixed;
                left: -250px;
                top: 0;
                width: 250px;
                height: 100%;
                background: #6b6b6b;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                transition: 0.5s;
                z-index: 1000;
            }

            .menü-top a,
            .menü-bottom a {
                display: flex;
                align-items: center;
                color: white;
                padding: 15px;
                text-decoration: none;
            }

            .menü-top a,
            .menü-bottom a {
                background: #575757;
            }

            .sidebar i {
                margin-right: 10px;
            }

        </style>
    </head>
    <body>

        <div class = "menü-btn" onclick = "toggleMenu()"><i class = "fa-solid fa-bars"></i></div>

        <div id = "sidebar" class = "sidebar">
            <div class = "menü-top">
                <a href = "#">
                    <i class = "fa-solid fa-box"></i> Inventar
                </a>
                <a href = "#">
                    <i class = "fa-solid fa-cart-shopping"></i> Einkaufsliste
                </a>
                <a href = "#">
                    <i class = "fa-solid fa-book"></i> Rezepte
                </a>
            </div>

            <div class = "menü-bottom">
                <a href = "#">
                    <i class = "fa-solid fa-user"></i> Profil
                </a>
                <a href = "#">
                    <i class = "fa-solid fa-gear"></i> Einstellungen
                </a>
            </div>
        </div>

        <h1>FridgAi</h1>

        <p>Die Zukunf ist da</p>
        
        <p>Dein smarter Kühlschrank</p>

        <div class="container">
            <div class="input-row">
                <input id="food"
                placeholder="Lebensmittel">

                <button onclick="addItem()">+</button>
            </div>
        </div>
        
        <ul id="list"></ul>

        <script>

            function toggleMenu() {
                let sidebar = document.getElementById("sidebar");
                if (sidebar.style.left === "0px") {
                    sidebar.style.left = "-250px";
                } else {
                    sidebar.style.left = "0px";
                }
            }

            let items = JSON.parse(localStorage.getItem("fridgeai"))|| [];

            function saveData() {
                localStorage.setItem("fridgeai",JSON.stringify(items));
            }

            function addItem() {
                let input = document.getElementById("food");
                if (input.value == "") return;
                items.push(input.value);
                input.value = "";
                saveData();
                render();
                input.focus();
            }

            function render() {
                let list = document.getElementById("list");
                 list.innerHTML = "";
                 
                 for (let i = 0; i< items.length; i++){
                    let li = document.createElement("li");
                    li.textContent = items[i];

                    //Löschen Button erstellen
                    let btn = document.createElement("button");
                    btn.innerHTML = '<i class="fa-solid fa-trash"></i<';
                    btn.style.background = "transparent";
                    btn.style.border = "none";
                    btn.style.cursor = "pointer";
                    btn.style.fontSize = "18px";

                    btn.onclick = function() {
                        deleteItem(i)
                    };

                    li.appendChild(btn);
                    list.appendChild(li);
                 }
            }

            function deleteItem(index) {
                items.splice(index, 1);
                saveData();
                render();
            }
            document.getElementById("food").addEventListener("keydown", function(event) {
                    if (event.key === "Enter") {
                        addItem();
                    }
            });
            render()

            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("sw.js");
            }

        </script>

    </body>
</html>
