<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" 
        content="width=device-width, initial-scale=1.0">
        <title>FridgAi</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background: #948888
                padding: 20px;
            }

            h1 {
                text-align: center;
            }

            p {
                text-align: center;
            }

            .container {
                max-width: 400px;
                margin: auto;
                background: #948888;
                padding: 15px;
                border-radius: 15px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }

            button {
                padding: 10px;
                border: none;
                border-radius: 10px;
                background: #4CAF50;
                colour: white;
                font-size: 16px;
            }

            li {
                display: flex;
                justify-content: space-between;
                padding: 10px;
                margin-top: 8px;
                background: #eee;
                border-radius: 10px;
            }

        </style>
    </head>
    <body>

        <h1>FridgAi</h1>

        <p>Die Zukunf ist da</p>
        
        <p>Dein smarter Kühlschrank</p>

        <div>
        <input id="food"
        placeholder="Lebensmittel">

        <button onclick="addItem()">+</button>
        </div>
        
        <ul id="list"></ul>
        

        <script>
            let items = JSON.parse(localStorage.getItem("fridgeai"))|| [];

            function saveData() {
                localStorage.setItem("fridgeai",JSON.stringify(items));
            }

            function addItem() {
                let input = document.getElementById("food");
                if (input.value == "") return;
                items.push(input.value);
                input.value = "";
                saveData();
                render();
            }

            function render() {
                let list = document.getElementById("list");
                 list.innerHTML = "";
                 
                 for (let i = 0; i< items.length; i++){
                    let li = document.createElement("li");
                    li.textContent = items[i];

                    //Löschen Button erstellen
                    let btn = document.createElement("button");
                    btn.textContent = "🗑️";
                    btn.style.background = "transparent";
                    btn.style.border = "none";
                    btn.style.cousor = "pointer";
                    btn.style.fontSize = "18px";

                    btn.onclick = function() {
                        deleteItem(i)
                    };

                    li.appendChild(btn);
                    list.appendChild(li);
                 }
            }

            function deleteItem(index) {
                items.splice(index, 1);
                render();
                render();
            }

        </script>

    </body>
</html>
