<!DOCTYPE html>
<html>
    <head>
        <meta name="theme-color" content="#ffffff">
        <link rel="manifest" href="manifest.json">
        <meta name="viewport" 
        content="width=device-width, initial-scale=1.0">
        <title>FridgAi</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <style>
            body {
                font-family: Arial, sans-serif;
                background: #ffffff;
                padding: 20px;
            }

            h1 {
                text-align: center;
                color: #2ebf21;
                font-size: 40px;
            }

            h2 {
                text-align: center;
                color: rgb(0, 0, 0);
                font-size: 35px;
            }

            p {
                text-align: center;
            }

            .start-link,
            .skip-link {
                text-decoration: none;
            }

            .start-btn {
                background: #2ebf21;
                color: white;
                padding: 15px;
                border-radius: 15px;
                text-align: center;
                font-size: 18px;
            }

            .skip-btn {
                background: #ffffff;
                color: #8b8b8b;
                padding: 15px;
                border-radius: 15px;
                text-align: center;
                font-size: 18px;
                margin: 15px;
            }

            ul {
                max-width: 400px;
                margin: 20px auto;
                padding: 0;
            }

            li {
                display: flex;
                justify-content: space-between;
                padding: 10px;
                margin-top: 8px;
                background: #eee;
                border-radius: 10px;
            }

            .sidebar {
                position: fixed;
                left: -250px;
                top: 0;
                width: 250px;
                height: 100vh;
                background: #6b6b6b;
                display: flex;
                flex-direction: column;
                transition: 0.5s;
                z-index: 1000;
            }

            .menü-btn {
                font-size: 22px;
                color: white;
                cursor: pointer;
            }

            .menü-top a,
            .menü-bottom a {
                display: flex;
                align-items: center;
                color: white;
                padding: 15px;
                text-decoration: none;
            }

            .menü-top a:hover
            .menü-bottom a:hover {
                background: #575757;
            }

            .sidebar i {
                margin-right: 10px;
            }

            .sidebar-header {
                padding: 15px;
                display: flex;
                justify-content: flex-end;
            }

            .sidebar-header i {
                color: white;
                font-size: 22px;
                cursor: pointer;
            }

            .menu-content {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }

            .menu-top a,
            .menu-bottom a {
                display: flex;
                align-items: center;
                color: white;
                padding: 15px;
                text-decoration: none;
            }

            .menu-top a: hover,
            .menu-bottom a: hover {
                background: #575757;
            }

            .sidebar i {
                margin-rigth: 10px;
            }

            .menu-bottom {
                border-top: 1px solid #555;
                margin-bottom: 10px;
            }

            .center-container {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 70vh;
            }

            .center-container img {
                width: 70%;
                max-width: 400px;
                heigth: auto;
            }

        </style>
    </head>
    <body>

        <h1>FridgAi</h1>

        <h2>Dein smarter<br>Kühlschrank.</h2>
        
        <p>Behalte den Überblick, vermeide<br>Lebensmittelverschwendung und<br>finde leckere Rezepte.</p>
        
        <div class = "center-container">
            <img src = "Login_Kühlschrank.jpeg" class = "center-img">
        </div>

        <a href = "Registrieren.html" class = "start-link">
            <div class = "start-btn">
                Los geht's
            </div>
        </a>
        <a href = "Start page.html" class = "skip-link">
            <div class = "skip-btn">
                Überspringen
            </div>
        </a>

        <script>

            let items = JSON.parse(localStorage.getItem("fridgeai"))|| [];

            function saveData() {
                localStorage.setItem("fridgeai",JSON.stringify(items));
            }

            function addItem() {
                let input = document.getElementById("food");
                if (input.value == "") return;
                items.push(input.value);
                input.value = "";
                saveData();
                render();
                input.focus();
            }

            function render() {
                let list = document.getElementById("list");
                 list.innerHTML = "";
                 
                 for (let i = 0; i< items.length; i++){
                    let li = document.createElement("li");
                    li.textContent = items[i];

                    //Löschen Button erstellen
                    let btn = document.createElement("button");
                    btn.innerHTML = '<i class="fa-solid fa-trash"></i<';
                    btn.style.background = "transparent";
                    btn.style.border = "none";
                    btn.style.cursor = "pointer";
                    btn.style.fontSize = "18px";

                    btn.onclick = function() {
                        deleteItem(i)
                    };

                    li.appendChild(btn);
                    list.appendChild(li);
                 }
            }

            function deleteItem(index) {
                items.splice(index, 1);
                saveData();
                render();
            }
            document.getElementById("food").addEventListener("keydown", function(event) {
                    if (event.key === "Enter") {
                        addItem();
                    }
            });
            render()

            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("sw.js");
            }

        </script>

    </body>
</html>
