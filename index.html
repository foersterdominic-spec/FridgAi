<!DOCTYPE html>
<html>
    <head>
        <meta name="theme-color" content="#5d8eef">
        <link rel="manifest" href="manifest.json">
        <meta name="viewport" 
        content="width=device-width, initial-scale=1.0">
        <title>FridgAi</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <style>
            body {
                font-family: Arial, sans-serif;
                background: #5d8eef;
                padding: 20px;
            }

            h1 {
                text-align: center;
            }

            p {
                text-align: center;
            }

            .container {
                max-width: 400px;
                margin: auto;
                background: #84c6ff;
                padding: 15px;
                border-radius: 15px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }

            button {
                padding: 10px;
                border: none;
                border-radius: 10px;
                background: #ffffff;
                colour: white;
                font-size: 16px;
            }

            ul {
                max-width: 400px;
                margin: 20px auto;
                padding: 0;
            }

            li {
                display: flex;
                justify-content: space-between;
                padding: 10px;
                margin-top: 8px;
                background: #eee;
                border-radius: 10px;
            }

            .input-row {
                display: flex;
                gap: 10px;
            }

            .input-row input {
                flex: 1;
            }

        </style>
    </head>
    <body>

        <h1>FridgAi</h1>

        <p>Die Zukunf ist da</p>
        
        <p>Dein smarter Kühlschrank</p>

        <div class="container">
            <div class="input-row">
                <input id="food"
                placeholder="Lebensmittel">

                <button onclick="addItem()">+</button>
            </div>
        </div>
        
        <ul id="list"></ul>

        <script>
            let items = JSON.parse(localStorage.getItem("fridgeai"))|| [];

            function saveData() {
                localStorage.setItem("fridgeai",JSON.stringify(items));
            }

            function addItem() {
                let input = document.getElementById("food");
                if (input.value == "") return;
                items.push(input.value);
                input.value = "";
                saveData();
                render();
                input.focus();
            }

            function render() {
                let list = document.getElementById("list");
                 list.innerHTML = "";
                 
                 for (let i = 0; i< items.length; i++){
                    let li = document.createElement("li");
                    li.textContent = items[i];

                    //Löschen Button erstellen
                    let btn = document.createElement("button");
                    btn.innerHTML = '<i class="fa-solid fa-trash"></i<';
                    btn.style.background = "transparent";
                    btn.style.border = "none";
                    btn.style.cursor = "pointer";
                    btn.style.fontSize = "18px";

                    btn.onclick = function() {
                        deleteItem(i)
                    };

                    li.appendChild(btn);
                    list.appendChild(li);
                 }
            }

            function deleteItem(index) {
                items.splice(index, 1);
                saveData();
                render();
            }
            document.getElementById("food").addEventListener("keydown", function(event) {
                    if (event.key === "Enter") {
                        addItem();
                    }
            });
            render()

            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("sw.js");
            }

        </script>

    </body>
</html>
